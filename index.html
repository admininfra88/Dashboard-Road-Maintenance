<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard Cost Ratio Road Maintenance 2025</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- Chart.js Data Labels Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>

  <!-- XLSX for reading Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    .chart-container {
      width: 90%;
      max-width: 1000px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    canvas {
      width: 100% !important;
      height: 400px !important;
    }
  </style>
</head>
<body>

  <h1>Dashboard Cost Ratio Road Maintenance 2025</h1>

  <div class="chart-container">
    <canvas id="barChart"></canvas>
  </div>

  <script>
    // ⬇️ Kunci utama: register plugin dulu sebelum pakai
    Chart.register(ChartDataLabels);

    const fileUrl = "https://raw.githubusercontent.com/admininfra88/Dashboard-Road-Maintenance/main/Data1.xlsx";

    async function loadExcelData() {
      const response = await fetch(fileUrl);
      const arrayBuffer = await response.arrayBuffer();
      const workbook = XLSX.read(arrayBuffer, { type: "array" });
      const sheetName = workbook.SheetNames[0];
      const sheet = workbook.Sheets[sheetName];
      const json = XLSX.utils.sheet_to_json(sheet);

      const labels = json.map(row => row['bulan']);
      const planData = json.map(row => Number(row['Plan']));
      const aktualData = json.map(row => Number(row['Aktual']));

      renderBarChart(labels, planData, aktualData);
    }

    function renderBarChart(labels, planData, aktualData) {
      const ctx = document.getElementById('barChart').getContext('2d');
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Plan',
              data: planData,
              backgroundColor: 'rgba(54, 162, 235, 0.7)',
            },
            {
              label: 'Aktual',
              data: aktualData,
              backgroundColor: 'rgba(255, 99, 132, 0.7)',
            }
          ]
        },
        options: {
          responsive: true,
          plugins: {
            title: {
              display: true,
              text: 'Dashboard Cost Ratio Road Maintenance 2025',
              font: { size: 18 }
            },
            legend: {
              position: 'top'
            },
            datalabels: {
              anchor: 'end',
              align: 'top',
              color: '#000',
              font: {
                weight: 'bold'
              },
              formatter: function(value) {
                if (value === 0 || isNaN(value)) return '';
                return value.toLocaleString('id-ID');
              }
            }
          },
          scales: {
            y: {
              beginAtZero: true
            }
          }
        },
        plugins: [ChartDataLabels]
      });
    }

    loadExcelData();
  </script>

</body>
</html>
