<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard Road Maintenance</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    h2 {
      text-align: center;
    }
    .chart-container {
      width: 90%;
      max-width: 1000px;
      margin: 30px auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <h2>📊 Dashboard Road Maintenance</h2>

  <!-- Grafik Bulanan -->
  <div class="chart-container">
    <canvas id="barChart"></canvas>
  </div>

  <!-- Grafik Total Tahunan -->
  <div class="chart-container">
    <canvas id="totalChart"></canvas>
  </div>

  <script>
    const excelURL = 'https://raw.githubusercontent.com/admininfra88/Dashboard-Road-Maintenance/main/Data1.xlsx';

    fetch(excelURL)
      .then(response => response.arrayBuffer())
      .then(data => {
        const workbook = XLSX.read(data, { type: 'array' });
        const sheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[sheetName];
        const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });

        const labels = json.slice(1).map(row => row[0]);
        const planData = json.slice(1).map(row => row[1]);
        const actualData = json.slice(1).map(row => row[2]);

        // === Grafik Bulanan ===
        const ctx = document.getElementById('barChart').getContext('2d');
        new Chart(ctx, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [
              {
                label: 'Plan',
                data: planData,
                backgroundColor: 'rgba(0, 102, 255, 0.8)',
              },
              {
                label: 'Aktual',
                data: actualData,
                backgroundColor: 'rgba(255, 153, 0, 0.8)',
              }
            ]
          },
          options: {
            responsive: true,
            plugins: {
              legend: { position: 'top' },
              tooltip: { enabled: true },
              title: {
                display: true,
                text: 'Perbandingan Plan vs Aktual (Bulanan)'
              }
            },
            scales: {
              y: {
                beginAtZero: true
              }
            }
          },
          plugins: [{
            id: 'dataLabels',
            afterDatasetsDraw(chart) {
              const {ctx} = chart;
              chart.data.datasets.forEach((dataset, i) => {
                const meta = chart.getDatasetMeta(i);
                meta.data.forEach((bar, index) => {
                  const value = dataset.data[index];
                  ctx.fillStyle = '#000';
                  ctx.font = '12px Arial';
                  ctx.textAlign = 'center';
                  ctx.fillText(value, bar.x, bar.y - 5);
                });
              });
            }
          }]
        });

        // === Grafik Total Tahunan ===
        const totalPlan = planData.reduce((a, b) => a + Number(b || 0), 0);
        const totalActual = actualData.reduce((a, b) => a + Number(b || 0), 0);

        const ctxTotal = document.getElementById('totalChart').getContext('2d');
        new Chart(ctxTotal, {
          type: 'bar',
          data: {
            labels: ['Total Plan', 'Total Aktual'],
            datasets: [
              {
                label: 'Total',
                data: [totalPlan, totalActual],
                backgroundColor: [
                  'rgba(0, 102, 255, 0.8)',
                  'rgba(255, 153, 0, 0.8)'
                ]
              }
            ]
          },
          options: {
            responsive: true,
            plugins: {
              legend: { display: false },
              tooltip: { enabled: true },
              title: {
                display: true,
                text: 'Total Plan vs Total Aktual (Tahunan)'
              }
            },
            scales: {
              y: {
                beginAtZero: true
              }
            }
          },
          plugins: [{
            id: 'dataLabelsTotal',
            afterDatasetsDraw(chart) {
              const {ctx} = chart;
              chart.data.datasets.forEach((dataset, i) => {
                const meta = chart.getDatasetMeta(i);
                meta.data.forEach((bar, index) => {
                  const value = dataset.data[index];
                  ctx.fillStyle = '#000';
                  ctx.font = '13px Arial';
                  ctx.textAlign = 'center';
                  ctx.fillText(value, bar.x, bar.y - 5);
                });
              });
            }
          }]
        });
      });
  </script>
</body>
</html>
