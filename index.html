<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard Road Maintenance</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    h2 {
      text-align: center;
    }
    #chartContainer {
      width: 90%;
      max-width: 900px;
      margin: 30px auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <h2>Dashboard Road Maintenance (Bar Chart)</h2>
  <div id="chartContainer">
    <canvas id="barChart"></canvas>
  </div>

  <script>
    const excelURL = 'https://raw.githubusercontent.com/admininfra88/Dashboard-Road-Maintenance/main/Data1.xlsx';

    fetch(excelURL)
      .then(response => response.arrayBuffer())
      .then(data => {
        const workbook = XLSX.read(data, { type: 'array' });
        const sheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[sheetName];
        const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });

        const labels = json.slice(1).map(row => row[0]);
        const planData = json.slice(1).map(row => row[1]);
        const actualData = json.slice(1).map(row => row[2]);

        const ctx = document.getElementById('barChart').getContext('2d');
        new Chart(ctx, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [
              {
                label: 'Plan',
                data: planData,
                backgroundColor: 'rgba(54, 162, 235, 0.7)',
              },
              {
                label: 'Aktual',
                data: actualData,
                backgroundColor: 'rgba(255, 99, 132, 0.7)',
              }
            ]
          },
          options: {
            responsive: true,
            plugins: {
              legend: { position: 'top' },
              tooltip: { enabled: true },
              datalabels: {
                anchor: 'end',
                align: 'end',
                color: '#000'
              }
            },
            scales: {
              y: {
                beginAtZero: true
              }
            }
          },
          plugins: [{
            id: 'dataLabels',
            afterDatasetsDraw(chart) {
              const {ctx} = chart;
              chart.data.datasets.forEach((dataset, i) => {
                const meta = chart.getDatasetMeta(i);
                meta.data.forEach((bar, index) => {
                  const value = dataset.data[index];
                  ctx.fillStyle = '#000';
                  ctx.font = '12px Arial';
                  ctx.textAlign = 'center';
                  ctx.fillText(value, bar.x, bar.y - 5);
                });
              });
            }
          }]
        });
      });
  </script>
</body>
</html>
