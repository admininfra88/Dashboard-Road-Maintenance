<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard Road Maintenance 2025</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }
    .container {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .chart-card {
      background: white;
      padding: 10px 20px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      flex: 1 1 48%;
      min-width: 400px;
    }
    h3 {
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="chart-card">
      <h3>Cost Ratio Road Maintenance 2025</h3>
      <canvas id="costChart"></canvas>
    </div>
    <div class="chart-card">
      <h3>Fuel Ratio 2025</h3>
      <canvas id="fuelChart"></canvas>
    </div>
  </div>

<script>
  const excelUrl = 'https://admininfra88.github.io/Dashboard-Road-Maintenance/Data1.xlsx';

  let costChart, fuelChart;

  // Ambil file Excel langsung dari URL repo
  fetch(excelUrl)
    .then(response => response.arrayBuffer())
    .then(data => {
      const workbook = XLSX.read(data, {type: 'array'});
      const sheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[sheetName];
      const jsonData = XLSX.utils.sheet_to_json(worksheet);

      const bulan = [];
      const planCost = [];
      const actualCost = [];
      const planFuel = [];
      const actualFuel = [];

      jsonData.forEach(row => {
        bulan.push(row['Bulan']);
        planCost.push(row['Plan']);
        actualCost.push(row['Actual']);
        planFuel.push(row['FR_Plan']);
        actualFuel.push(row['FR_Actual']);
      });

      renderCostChart(bulan, planCost, actualCost);
      renderFuelChart(bulan, frplanFuel, fractualFuel);
    })
    .catch(error => console.error('Gagal membaca file Excel:', error));

  function renderCostChart(labels, planData, actualData) {
    if (costChart) costChart.destroy();
    const ctx = document.getElementById('costChart').getContext('2d');
    costChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [
          { label: 'Plan', data: planData, backgroundColor: 'rgba(54, 162, 235, 0.7)' },
          { label: 'Actual', data: actualData, backgroundColor: 'rgba(255, 99, 132, 0.7)' }
        ]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { position: 'top' },
          tooltip: { enabled: true }
        },
        scales: {
          y: { beginAtZero: true }
        }
      }
    });
  }

  function renderFuelChart(labels, planData, actualData) {
    if (fuelChart) fuelChart.destroy();
    const ctx = document.getElementById('fuelChart').getContext('2d');
    fuelChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [
          { label: 'Plan', data: planData, backgroundColor: 'rgba(54, 162, 235, 0.7)' },
          { label: 'Actual', data: actualData, backgroundColor: 'rgba(255, 99, 132, 0.7)' }
        ]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { position: 'top' },
          tooltip: { enabled: true }
        },
        scales: {
          y: { beginAtZero: true }
        }
      }
    });
  }
</script>
</body>
</html>
