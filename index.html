<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard Cost Ratio Road Maintenance 2025</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f6f8;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .chart-container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 20px;
      margin-bottom: 40px;
      max-width: 1000px;
      margin-left: auto;
      margin-right: auto;
    }
    canvas {
      max-width: 100%;
    }
  </style>
</head>
<body>

  <h2>📊 Dashboard Cost Ratio Road Maintenance 2025</h2>

  <div class="chart-container">
    <canvas id="monthlyChart"></canvas>
  </div>

  <div class="chart-container">
    <canvas id="totalChart"></canvas>
  </div>

  <script>
    const excelUrl = 'https://raw.githubusercontent.com/admininfra88/Dashboard-Road-Maintenance/main/Data1.xlsx';

    async function fetchExcelData(url) {
      const response = await fetch(url);
      const arrayBuffer = await response.arrayBuffer();
      const workbook = XLSX.read(arrayBuffer, { type: 'array' });
      const sheetName = workbook.SheetNames[0];
      const sheet = workbook.Sheets[sheetName];
      return XLSX.utils.sheet_to_json(sheet);
    }

    function renderCharts(data) {
      const labels = data.map(row => row['Bulan']);
      const planData = data.map(row => Number(row['Plan']));
      const aktualData = data.map(row => Number(row['Aktual']));

      // Grafik Bulanan
      const ctx1 = document.getElementById('monthlyChart').getContext('2d');
      new Chart(ctx1, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Plan',
              data: planData,
              backgroundColor: 'blue'
            },
            {
              label: 'Aktual',
              data: aktualData,
              backgroundColor: 'orange'
            }
          ]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: 'top'
            },
            title: {
              display: true,
              text: 'Perbandingan Plan vs Aktual (Bulanan)'
            },
            datalabels: {
              display: true
            }
          },
          scales: {
            y: {
              beginAtZero: true
            }
          }
        }
      });

      // Grafik Total
      const totalPlan = planData.reduce((a,b) => a+b, 0);
      const totalAktual = aktualData.reduce((a,b) => a+b, 0);

      const ctx2 = document.getElementById('totalChart').getContext('2d');
      new Chart(ctx2, {
        type: 'bar',
        data: {
          labels: ['Total Plan', 'Total Aktual'],
          datasets: [
            {
              label: 'Total',
              data: [totalPlan, totalAktual],
              backgroundColor: ['blue', 'orange']
            }
          ]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            title: {
              display: true,
              text: 'Total Cost Ratio Plan vs Aktual 2025'
            }
          },
          scales: {
            y: {
              beginAtZero: true
            }
          }
        }
      });
    }

    fetchExcelData(excelUrl).then(renderCharts);
  </script>

</body>
</html>
