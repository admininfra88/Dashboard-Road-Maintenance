<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard Road Maintenance 2025</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body {
      background-color: #f4f4f4;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    h2 {
      text-align: center;
      margin-bottom: 10px;
    }
    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr; /* kiri-kanan */
      gap: 20px;
      max-width: 1800px;
      margin: 0 auto;
    }
    .chart-container {
      background: #fff;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    canvas {
      width: 100%;
      height: 450px;
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <div class="chart-container">
      <h2>Cost Ratio Road Maintenance 2025</h2>
      <canvas id="costChart"></canvas>
    </div>
    <div class="chart-container">
      <h2>Fuel Ratio 2025</h2>
      <canvas id="fuelChart"></canvas>
    </div>
  </div>

  <script>
    const EXCEL_URL = 'https://admininfra88.github.io/Dashboard-Road-Maintenance/Data1.xlsx';

    let costChart, fuelChart;

    async function loadExcelData() {
      const response = await fetch(EXCEL_URL);
      const arrayBuffer = await response.arrayBuffer();
      const workbook = XLSX.read(arrayBuffer, { type: 'array' });
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(sheet);
      renderCharts(json);
    }

    function renderCharts(data) {
      const labels = data.map(row => row.Bulan);
      const planCost = data.map(row => row['Plan Cost']);
      const actualCost = data.map(row => row['Aktual Cost']);
      const planFuel = data.map(row => row['Plan Fuel']);
      const actualFuel = data.map(row => row['Aktual Fuel']);

      if (costChart) costChart.destroy();
      if (fuelChart) fuelChart.destroy();

      const commonOptions = {
        responsive: true,
        plugins: {
          legend: { position: 'top' },
          datalabels: {
            anchor: 'end',
            align: 'end',
            formatter: (val) => {
              if (typeof val === 'number') {
                return val % 1 === 0 ? val : val.toFixed(2);
              }
              return val;
            },
            color: '#000',
            font: { weight: 'bold' }
          }
        },
        scales: {
          y: { beginAtZero: true }
        }
      };

      // === Cost Chart ===
      costChart = new Chart(document.getElementById('costChart'), {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Plan',
              backgroundColor: '#2f65b9',
              data: planCost,
            },
            {
              label: 'Aktual',
              backgroundColor: '#d34c4c',
              data: actualCost,
            }
          ]
        },
        options: commonOptions,
        plugins: [ChartDataLabels]
      });

      // === Fuel Chart ===
      fuelChart = new Chart(document.getElementById('fuelChart'), {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Plan',
              backgroundColor: '#2f65b9',
              data: planFuel,
            },
            {
              label: 'Aktual',
              backgroundColor: '#d34c4c',
              data: actualFuel,
            }
          ]
        },
        options: commonOptions,
        plugins: [ChartDataLabels]
      });
    }

    // Load data saat halaman dibuka
    loadExcelData();
  </script>

</body>
</html>
