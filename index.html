<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard Road Maintenance 2025</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body {
      background-color: #f4f4f4;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    h2 {
      text-align: center;
      margin-bottom: 10px;
    }
    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr; /* 2 kolom berdampingan */
      gap: 20px;
      max-width: 1600px;
      margin: 0 auto;
    }
    .chart-container {
      background: #fff;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    canvas {
      width: 100%;
      height: 400px;
    }
    #fileInput {
      display: block;
      margin: 0 auto 20px auto;
    }
  </style>
</head>
<body>

  <input type="file" id="fileInput" accept=".xlsx" />

  <div class="dashboard">
    <div class="chart-container">
      <h2>Cost Ratio Road Maintenance 2025</h2>
      <canvas id="costChart"></canvas>
    </div>
    <div class="chart-container">
      <h2>Fuel Ratio 2025</h2>
      <canvas id="fuelChart"></canvas>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    let costChart, fuelChart;

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      const reader = new FileReader();
      reader.onload = (evt) => {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet);

        const labels = json.map(row => row.Bulan);
        const planCost = json.map(row => row['Plan Cost']);
        const actualCost = json.map(row => row['Aktual Cost']);
        const planFuel = json.map(row => row['Plan Fuel']);
        const actualFuel = json.map(row => row['Aktual Fuel']);

        // Hapus chart lama jika ada (supaya tidak dobel saat upload ulang)
        if (costChart) costChart.destroy();
        if (fuelChart) fuelChart.destroy();

        // === Cost Chart ===
        costChart = new Chart(document.getElementById('costChart'), {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [
              {
                label: 'Plan',
                backgroundColor: '#2f65b9',
                data: planCost,
              },
              {
                label: 'Aktual',
                backgroundColor: '#d34c4c',
                data: actualCost,
              }
            ]
          },
          options: {
            responsive: true,
            plugins: {
              legend: { position: 'top' }
            },
            scales: { y: { beginAtZero: true } }
          }
        });

        // === Fuel Chart ===
        fuelChart = new Chart(document.getElementById('fuelChart'), {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [
              {
                label: 'Plan',
                backgroundColor: '#2f65b9',
                data: planFuel,
              },
              {
                label: 'Aktual',
                backgroundColor: '#d34c4c',
                data: actualFuel,
              }
            ]
          },
          options: {
            responsive: true,
            plugins: {
              legend: { position: 'top' }
            },
            scales: { y: { beginAtZero: true } }
          }
        });
      };
      reader.readAsArrayBuffer(file);
    });
  </script>

</body>
</html>
