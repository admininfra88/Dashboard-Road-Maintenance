<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard Cost Ratio Road Maintenance 2025</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }
    .chart-container {
      max-width: 1000px;
      margin: 30px auto;
      background: #fff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      margin-top: 0;
    }
  </style>
</head>
<body>

  <!-- Grafik 1 -->
  <div class="chart-container">
    <h2>Cost Ratio Road Maintenance 2025</h2>
    <canvas id="costChart"></canvas>
  </div>

  <!-- Grafik 2 -->
  <div class="chart-container">
    <h2>Fuel Ratio 2025</h2>
    <canvas id="fuelChart"></canvas>
  </div>

  <script>
    const excelURL = 'https://raw.githubusercontent.com/admininfra88/Dashboard-Road-Maintenance/main/Data1.xlsx';
    const bulan = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec', 'Total'];

    fetch(excelURL)
      .then(response => response.arrayBuffer())
      .then(data => {
        const workbook = XLSX.read(data, { type: 'array' });
        
        // --- Sheet 1 untuk Cost Ratio ---
        const sheet1 = workbook.Sheets[workbook.SheetNames[0]];
        const json1 = XLSX.utils.sheet_to_json(sheet1, { header: 1 });

        // Ambil Plan (kolom B) dan Actual (kolom C)
        const costPlan = json1.slice(1).map(row => row[1] || 0);
        const costActual = json1.slice(1).map(row => row[2] || 0);

        // --- Sheet 2 untuk Fuel Ratio ---
        const sheet2 = workbook.Sheets[workbook.SheetNames[1]];
        const json2 = XLSX.utils.sheet_to_json(sheet2, { header: 1 });

        const fuelPlan = json2.slice(1).map(row => row[1] || 0);
        const fuelActual = json2.slice(1).map(row => row[2] || 0);

        // GRAFIK COST
        new Chart(document.getElementById('costChart'), {
          type: 'bar',
          data: {
            labels: bulan,
            datasets: [
              { label: 'Plan', data: costPlan, backgroundColor: '#4e79a7' },
              { label: 'Aktual', data: costActual, backgroundColor: '#e15759' }
            ]
          },
          options: {
            responsive: true,
            plugins: {
              legend: { position: 'top' },
              tooltip: { mode: 'index', intersect: false },
              datalabels: {
                anchor: 'end',
                align: 'end',
                formatter: (value) => value !== 0 ? value : ''
              }
            },
            interaction: { mode: 'index', intersect: false },
            scales: {
              x: { ticks: { font: { size: 12 } } },
              y: { beginAtZero: true }
            }
          },
          plugins: [ChartDataLabels]
        });

        // GRAFIK FUEL
        new Chart(document.getElementById('fuelChart'), {
          type: 'bar',
          data: {
            labels: bulan,
            datasets: [
              { label: 'Plan', data: fuelPlan, backgroundColor: '#4e79a7' },
              { label: 'Aktual', data: fuelActual, backgroundColor: '#e15759' }
            ]
          },
          options: {
            responsive: true,
            plugins: {
              legend: { position: 'top' },
              tooltip: { mode: 'index', intersect: false },
              datalabels: {
                anchor: 'end',
                align: 'end',
                formatter: (value) => value !== 0 ? value.toFixed(2) : ''
              }
            },
            interaction: { mode: 'index', intersect: false },
            scales: {
              x: { ticks: { font: { size: 12 } } },
              y: { beginAtZero: true }
            }
          },
          plugins: [ChartDataLabels]
        });

      });
  </script>

</body>
</html>
