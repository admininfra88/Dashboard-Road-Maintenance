<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard Road Maintenance</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    h2 {
      text-align: center;
    }
    .chart-box {
      width: 90%;
      max-width: 900px;
      margin: 30px auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <!-- ===================== Grafik Cost Ratio 2025 ===================== -->
  <h2>Cost Ratio Road Maintenance 2025</h2>
  <div class="chart-box">
    <canvas id="costChart"></canvas>
  </div>

  <!-- ===================== Grafik Fuel Ratio 2025 ===================== -->
  <h2>Fuel Ratio 2025</h2>
  <div class="chart-box">
    <canvas id="fuelChart"></canvas>
  </div>

  <script>
    const excelURL = 'https://raw.githubusercontent.com/admininfra88/Dashboard-Road-Maintenance/main/Data1.xlsx';

    fetch(excelURL)
      .then(response => response.arrayBuffer())
      .then(data => {
        const workbook = XLSX.read(data, { type: 'array' });

        // ===================== Sheet 1: Cost Ratio =====================
        const sheetCost = workbook.Sheets[workbook.SheetNames[0]];
        const jsonCost = XLSX.utils.sheet_to_json(sheetCost, { header: 1 });

        const labelsCost = jsonCost.slice(1).map(row => row[0]);
        const planCost = jsonCost.slice(1).map(row => row[1]);
        const actualCost = jsonCost.slice(1).map(row => row[2]);

        const ctxCost = document.getElementById('costChart').getContext('2d');
        new Chart(ctxCost, {
          type: 'bar',
          data: {
            labels: labelsCost,
            datasets: [
              {
                label: 'Plan',
                data: planCost,
                backgroundColor: 'rgba(54, 162, 235, 0.7)',
              },
              {
                label: 'Aktual',
                data: actualCost,
                backgroundColor: 'rgba(255, 132, 99, 0.7)',
              }
            ]
          },
          options: {
            responsive: true,
            plugins: {
              legend: { position: 'top' },
              tooltip: { enabled: true },
              datalabels: {
                anchor: 'end',
                align: 'end',
                color: '#000',
                font: {
                  weight: 'bold'
                }
              }
            },
            scales: {
              y: { beginAtZero: true }
            }
          },
          plugins: [ChartDataLabels]
        });

        // ===================== Sheet 2: Fuel Ratio =====================
        const sheetFuel = workbook.Sheets[workbook.SheetNames[1]];
        const jsonFuel = XLSX.utils.sheet_to_json(sheetFuel, { header: 1 });

        const labelsFuel = jsonFuel.slice(1).map(row => row[0]);
        const planFuel = jsonFuel.slice(1).map(row => row[1]);
        const actualFuel = jsonFuel.slice(1).map(row => row[2]);

        const ctxFuel = document.getElementById('fuelChart').getContext('2d');
        new Chart(ctxFuel, {
          type: 'bar',
          data: {
            labels: labelsFuel,
            datasets: [
              {
                label: 'Plan',
                data: planFuel,
                backgroundColor: '#4A90E2'
              },
              {
                label: 'Aktual',
                data: actualFuel,
                backgroundColor: '#F77E70'
              }
            ]
          },
          options: {
            responsive: true,
            plugins: {
              legend: { position: 'top' },
              tooltip: { enabled: true },
              datalabels: {
                anchor: 'end',
                align: 'end',
                color: '#000',
                font: {
                  weight: 'bold'
                }
              }
            },
            scales: {
              y: { beginAtZero: true }
            }
          },
          plugins: [ChartDataLabels]
        });
      });
  </script>

</body>
</html>
